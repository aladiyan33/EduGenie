name: Generate Submission PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.md'
      - 'scripts/generate_submission_pdfs.py'
      - '.github/workflows/generate-pdfs.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependency
        run: python -m pip install reportlab
      - name: Generate PDFs
        run: python scripts/generate_submission_pdfs.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '**/*.pdf'
          if git diff --cached --quiet; then
            echo "No PDF changes."
            exit 0
          fi
          git commit -m "Add binary PDF submission deliverables [skip ci]"
          git push
