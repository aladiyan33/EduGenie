name: Build Sample Project Documentation

on:
  push:
    paths:
      - ".github/workflows/build-sample-doc.yml"
      - "scripts/build_sample_doc.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - run: python scripts/build_sample_doc.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "7.Project Documentation/Sample Project Documentation.pdf"
          git commit -m "Update Sample Project Documentation to 21-page reference-style design" || exit 0
          git push
