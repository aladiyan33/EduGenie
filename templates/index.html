<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGenie — Google Gemini Powered Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="page">
    <header class="hero">
      <div class="brand">EduGenie 🧠✨</div>
      <h1>Learn smarter with <span>EduGenie</span></h1>
      <p>Your AI-powered learning assistant for questions, explanations, quizzes, summaries and learning recommendations.</p>
    </header>

    <section class="app-card">
      <nav class="taskbar" aria-label="EduGenie tasks">
        <button class="task active" data-task="qa">Ask a Question</button>
        <button class="task" data-task="explain">Explain a Topic</button>
        <button class="task" data-task="summary">Summarize</button>
        <button class="task" data-task="quiz">Generate a Quiz</button>
        <button class="task" data-task="learn">Learning Recommendations</button>
      </nav>

      <section id="workspace" class="workspace"></section>
    </section>

    <footer>
      <span>EduGenie</span>
      <span>FastAPI • Gemini 1.5 Pro • LaMini-Flan-T5-783M</span>
    </footer>
  </main>

<script>
const workspace = document.getElementById("workspace");
let currentTask = "qa";

const forms = {
  qa: {
    title: "Ask EduGenie a Question",
    subtitle: "Ask anything you want to understand.",
    html: '<input id="question" placeholder="e.g. What is machine learning?"><button class="primary" onclick="runTask()">Get Answer</button>'
  },
  explain: {
    title: "Need an Explanation?",
    subtitle: "Enter a topic and EduGenie will explain it in simple language.",
    html: '<input id="topic" placeholder="e.g. Recursion"><button class="primary" onclick="runTask()">Explain</button>'
  },
  summary: {
    title: "Summarize a Paragraph",
    subtitle: "Paste long study material and keep the important ideas.",
    html: '<textarea id="text" placeholder="Paste your study material here..."></textarea><button class="primary" onclick="runTask()">Summarize</button>'
  },
  quiz: {
    title: "Generate a Quiz",
    subtitle: "EduGenie creates three questions with four options each.",
    html: '<input id="topic" placeholder="e.g. Pythagoras Theorem"><button class="primary" onclick="runTask()">Generate Quiz</button>'
  },
  learn: {
    title: "Get Learning Recommendations",
    subtitle: "Build a path from beginner level to advanced level.",
    html: '<input id="topic" placeholder="e.g. SQL"><button class="primary" onclick="runTask()">Get Recommendations</button>'
  }
};

function render(task) {
  currentTask = task;
  workspace.innerHTML =
    '<div class="form-card"><h2>' + forms[task].title + '</h2>' +
    '<p>' + forms[task].subtitle + '</p>' +
    '<div class="form-area">' + forms[task].html + '</div></div>' +
    '<div id="loading" class="loading hidden">EduGenie is thinking...</div>' +
    '<div id="result" class="result hidden"></div>';
}

document.querySelectorAll(".task").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".task").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    render(button.dataset.task);
  });
});

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[char]);
}

function formatText(value) {
  return escapeHtml(value).replace(/
/g, "<br>");
}

async function runTask() {
  const loading = document.getElementById("loading");
  const result = document.getElementById("result");
  let endpoint;
  let body;

  if (currentTask === "qa") {
    endpoint = "/qa";
    body = { question: document.getElementById("question").value };
  } else if (currentTask === "explain") {
    endpoint = "/explain";
    body = { topic: document.getElementById("topic").value };
  } else if (currentTask === "summary") {
    endpoint = "/summarize";
    body = { text: document.getElementById("text").value };
  } else if (currentTask === "quiz") {
    endpoint = "/quiz";
    body = { topic: document.getElementById("topic").value };
  } else {
    endpoint = "/learn/recommendations";
    body = { topic: document.getElementById("topic").value };
  }

  result.classList.add("hidden");
  loading.classList.remove("hidden");

  try {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const data = await response.json();

    if (!response.ok) throw new Error(data.detail || "Something went wrong.");

    result.classList.remove("hidden");

    if (currentTask === "qa") {
      result.innerHTML = "<h3>Answer</h3><div>" + formatText(data.answer) + "</div>";
    } else if (currentTask === "explain") {
      result.innerHTML = "<h3>Explanation</h3><div>" + formatText(data.explanation) + "</div>";
    } else if (currentTask === "summary") {
      result.innerHTML = "<h3>Summary</h3><div>" + formatText(data.summary) + "</div>";
    } else if (currentTask === "learn") {
      result.innerHTML = "<h3>Learning Recommendations</h3><div>" + formatText(data.recommendations) + "</div>";
    } else {
      renderQuiz(data, result);
    }
  } catch (error) {
    result.classList.remove("hidden");
    result.innerHTML = '<div class="error">' + escapeHtml(error.message) + "</div>";
  } finally {
    loading.classList.add("hidden");
  }
}

function renderQuiz(data, result) {
  let html = "<h3>" + escapeHtml(data.title) + "</h3>";
  html += '<p class="quiz-note">Choose an answer and click <b>Check Answer</b>. EduGenie will tell you if it is correct.</p>';

  data.questions.forEach((question, index) => {
    html += '<article class="quiz-question">';
    html += "<h4>Q" + (index + 1) + ". " + escapeHtml(question.question) + "</h4>";
    html += '<div class="options">';

    question.options.forEach((option, optionIndex) => {
      const id = "q" + index + "o" + optionIndex;
      html += '<label class="option" for="' + id + '">';
      html += '<input id="' + id + '" type="radio" name="q' + index + '" value="' + escapeHtml(option) + '">';
      html += "<span>" + escapeHtml(option) + "</span></label>";
    });

    html += "</div>";
    html += '<button class="check-btn" onclick="checkAnswer(' + index + ', this)">Check Answer</button>';
    html += '<div class="quiz-feedback" id="feedback' + index + '"></div>';
    html += "</article>";
  });

  result.innerHTML = html;
  window.quizQuestions = data.questions;
}

function checkAnswer(index, button) {
  const selected = document.querySelector('input[name="q' + index + '"]:checked');
  const feedback = document.getElementById("feedback" + index);
  const question = window.quizQuestions[index];

  if (!selected) {
    feedback.className = "quiz-feedback wrong";
    feedback.textContent = "Please choose an option first.";
    return;
  }

  if (selected.value === question.answer) {
    feedback.className = "quiz-feedback correct";
    feedback.innerHTML = "✓ Correct! " + escapeHtml(question.explanation);
  } else {
    feedback.className = "quiz-feedback wrong";
    feedback.innerHTML = "✗ Incorrect. Correct answer: <b>" +
      escapeHtml(question.answer) + "</b><br>" + escapeHtml(question.explanation);
  }

  button.disabled = true;
}

render("qa");
</script>
</body>
</html>
